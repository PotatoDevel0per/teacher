relevance_to_user:
  - "LMR(CutMix류 spectrogram 패치 교체)는 UniqueShip에서 범용(비물리) 증강 baseline 후보"
  - "smoothness-inducing regularization(clean/noisy 예측 대칭 KL)은 물리 증강 샘플을 CE 대신 일관성 항으로만 쓰는 학습 방식의 비교군 후보"
  - "noise aug·GAN aug가 일관된 이득을 주지 못했다는 보고 → '저품질 시뮬레이션 샘플은 해가 될 수 있다'는 물리 증강 연구의 위험 근거"
limitations:
  - "분할은 녹음 파일(audio track) 단위. 선박 단위 분리 아님 → 같은 선박의 다른 녹음이 train/test에 모두 있을 수 있음"
  - "seed 수·표준편차 미보고 (단일 실행으로 보임)"
  - "Table 3의 smooth reg 수치는 Table 5에서 α를 데이터셋·특징별로 골라 최고값을 옮긴 것으로 보임 (test 기준 선택 의심)"
  - "ShipsEar test가 116 segment라 1 segment = 0.86 pp"
  - "LMR의 a,b 분포, 패치 위치·개수, 짝 선택 방식이 수식 수준으로만 기술됨"
  - "CutMix를 인용했지만 비교 실험 없음 (mixup과만 비교)"
