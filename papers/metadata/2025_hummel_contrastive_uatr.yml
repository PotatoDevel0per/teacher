code_url: "https://github.com/hildeingvildhummel/UATR (원문 각주 2, 저장소 내용 미확인)"
datasets: [ONC SCVIP 하이드로폰 무라벨 데이터 (2019-09 ~ 2020-12, 30 GB), DeepShip, ShipsEar, Best of Watkins]
topics:
  - underwater_acoustic
