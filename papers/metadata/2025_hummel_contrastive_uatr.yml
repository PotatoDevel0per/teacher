paper_id: 2025_hummel_contrastive_uatr
title: "The Computation of Generalized Embeddings for Underwater Acoustic Target Recognition using Contrastive Learning"
authors: [Hilde I. Hummel, Arwin Gansekoele, Sandjai Bhulai, Rob van der Mei]
year: 2025
venue: "arXiv preprint (arXiv:2505.12904v1, 2025-05-19). 게재본: Applied Acoustics 243 (2026) 111103 (2026_hummel_linear_probing의 참고문헌 [11]에서 확인, 게재본 PDF는 미확보)"
doi: "10.48550/arXiv.2505.12904 (게재본: 10.1016/j.apacoust.2025.111103)"
official_url: "https://arxiv.org/abs/2505.12904"
