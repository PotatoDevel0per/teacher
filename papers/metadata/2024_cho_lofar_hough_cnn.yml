limitations:
  - "Feature extraction itself is not evaluated quantitatively (no tonal ground truth, no detection rate); only classification accuracy"
  - "1-min segments split 7:3, apparently at random -> same recording can land in train and test (leakage). Gains +3.56 to +5.70 pp are single runs"
  - "Passenger class may mix ShipsEar and DeepShip -> possible dataset shortcut"
  - "Missing: window function, delta-f, normalization method, edge detector, rho/theta resolution. Hough threshold = 130 (accumulator votes, Fig. 6, set visually). 'Window size 100' has no unit: 100 samples at 32 kHz gives delta-f = 320 Hz, which contradicts the 15.2 Hz harmonic analysis in Fig. 8"
  - "No validation set mentioned; 7:3 split of the generated images"
  - "Text F1 gain 0.0431-0.059 does not match Table 6 (0.0380-0.0583)"
