relevance_to_user:
  - "Detects and recovers weak, fluctuating tonal lines in a LOFARgram (output: pixel probability map; trajectory needs post-processing)"
  - "Single-channel LOFARgram input, so it applies to DeepShip and UniqueShip"
  - "Can evaluate tonal preservation (OP6) and support tonal-based augmentation design"
limitations:
  - "arXiv v1: single line + white Gaussian noise only, synthetic data only, no real data"
  - "Output is a pixel probability map (gradient saliency), not a numeric trajectory; detection is per-lofargram"
  - "Synthesis/STFT parameters missing in arXiv v1; time-domain SNR not transferable without FFT length"
  - "No numeric tables, 200 test images, single run; no code released"
  - "Full-scale training (AlexNet/VGG, 100K iter, double backprop) needs GPU"
selection_note: "2026-10-12 tentative choice for the LOFAR study (handoffs/2026-10-12_to_LOFAR.md)"
selection_verdict: "2026-10-12 ON HOLD. arXiv v1: criterion (b) met (ROC, LLA); (a) not met (fs, random-walk params, STFT window/df, freq range, normalization, label line width missing; delegated to Paris & Jauffret 2003). Requested JASA version from user."
