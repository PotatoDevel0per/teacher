relevance_to_user:
  - "범용 스펙트로그램 증강(주파수 마스킹, SpecAugment, Mixup) 대비 비교 프로토콜의 참고 사례 (Fig. 6)"
  - "'knowledge-inspired'라는 이름과 달리 물리 기반 증강이 아님: 스펙트로그램 이미지의 2D FFT 저역 통과/고역 잡음 치환 (§II.A, 저자 스스로 '물리적 분해가 아님'이라고 명시)"
  - "clean 조건에서는 SDA가 SpecAugment·Mixup보다 낮음 → 잡음 주입이 없는 UniqueShip 설정에서 이득은 근거 없음"
limitations:
  - "few-shot 메타러닝 설정(클래스 단위 base/novel 분할). 녹음·선박 단위 분할 언급 없음; support/query를 같은 클래스 후보 풀(3 s 세그먼트)에서 뽑음 → 같은 녹음이 support와 query에 동시에 들어갈 수 있음"
  - "DanShip 교차 도메인: 소스는 ShipsEar 전체(Fishing, Motorboats 포함), 타깃 DanShip 클래스(fishing, cargo, motorboats)와 의미상 겹침"
  - "저 SNR 이득은 학습 때 같은 계열의 '자연 해양 잡음'을 주입(SNR U[-15,7] dB)한 뒤 같은 방식으로 잡음을 넣은 테스트에서 측정. 잡음 출처·분리 미기재"
  - "seed 수, 학습 epoch, N-way 값, query 수, PSG 변환 A(·)의 구체 형태 미기재"
  - "200 에피소드 95% CI를 3개 split 평균으로 보고. 학습 반복(독립 seed) 변동은 보고되지 않음"
